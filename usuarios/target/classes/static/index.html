<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Usuarios - JDBC</title>
    <style>
        /* --- Estilos básicos del frontend --- */
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f7fa; }
        h1 { color: #2c3e50; }
        .contenedor { display: flex; gap: 30px; flex-wrap: wrap; }
        .tarjeta { background: #fff; padding: 20px; border-radius: 8px;
                   box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        input, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
        button { background: #3498db; color: #fff; border: none; cursor: pointer; }
        button.eliminar { background: #e74c3c; }
        button.actualizar { background: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #ecf0f1; }
        .mensaje { margin-top: 10px; padding: 8px; border-radius: 4px; display: none; }
        .ok { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <h1>CRUD de Usuarios (Spring Boot + JDBC)</h1>

    <!-- Se muestra el mensaje de resultado de cada operación -->
    <div id="mensaje" class="mensaje"></div>

    <div class="contenedor">

        <!-- FORMULARIO para crear / actualizar -->
        <div class="tarjeta">
            <h2>Formulario Usuario</h2>

            <input type="hidden" id="id" placeholder="id (auto)">
            <label>Nombre</label>
            <input type="text" id="nombre" placeholder="Nombre del usuario">
            <label>Dirección</label>
            <input type="text" id="direccion" placeholder="Dirección">
            <label>Teléfono</label>
            <input type="number" id="telefono" placeholder="Teléfono">
            <label>Correo</label>
            <input type="email" id="correo" placeholder="Correo">
            <label>Saldo</label>
            <input type="number" id="saldo" placeholder="Saldo">

            <button onclick="guardar()">Guardar Usuario</button>
            <button onclick="cancelarEdicion()" style="background:#95a5a6;">Cancelar Edición</button>
        </div>

        <!-- TABLA con la lista de usuarios -->
        <div class="tarjeta">
            <h2>Lista de Usuarios</h2>
            <button onclick="listar()">Actualizar Lista</button>
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Nombre</th><th>Dirección</th>
                        <th>Teléfono</th><th>Correo</th><th>Saldo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>

    </div>

    <script>
        /* ================================================================
         *  CAPA DE VISTA / FRONTEND — consumo de la API con FETCH
         * ================================================================
         *  Este archivo es la "Vista" del patrón MVC/MVT adaptada a una
         *  API REST: no hay plantillas de servidor; el HTML es estático y
         *  los datos llegan como JSON desde el microservicio (puerto 8081).
         *
         *  TECNOLOGÍAS Y CONCEPTOS:
         *   - fetch(): API nativa del navegador para hacer peticiones HTTP
         *     (AJAX) sin recargar la página. Es el puente frontend↔backend.
         *   - async/await sobre PROMESAS: permite escribir código asíncrono
         *     como si fuera secuencial; "await" espera la respuesta sin
         *     congelar la interfaz.
         *   - JSON: formato del intercambio. JSON.stringify() convierte el
         *     objeto JS → texto para el body; res.json() hace lo inverso.
         *   - DOM: manipulamos el HTML en vivo (getElementById,
         *     createElement, innerHTML) para pintar la tabla.
         *
         *  BUENA PRÁCTICA — SEPARACIÓN FRONTEND/BACKEND:
         *  El frontend solo conoce URLs y JSON; no sabe nada de Java ni de
         *  MySQL. Por eso backend y frontend se pueden desplegar, escalar
         *  o reescribir por separado (contrato = la API REST).
         * ================================================================ */

        /**
         * URL raíz de la API. Apunta al @RequestMapping del controller.
         * Cambiar aquí el puerto es todo lo que haría falta si el
         * microservicio se despliega en otro host.
         */
        const BASE_URL = "http://localhost:8081/api/usuarios";

        // --- Mostrar mensaje de éxito o error en pantalla ---
        function mostrarMensaje(texto, esError) {
            const m = document.getElementById("mensaje");
            m.textContent = texto;
            m.className = "mensaje " + (esError ? "error" : "ok");
            m.style.display = "block";
            setTimeout(() => m.style.display = "none", 3000);
        }

        // --- VALIDACIÓN en el frontend (antes de llamar a la API) ---
        function validarFormulario(usuario) {
            if (!usuario.nombre || usuario.nombre.trim().length === 0) {
                mostrarMensaje("El nombre es obligatorio", true);
                return false;
            }
            if (!usuario.correo || !usuario.correo.includes("@")) {
                mostrarMensaje("El correo debe ser válido", true);
                return false;
            }
            if (usuario.saldo < 0) {
                mostrarMensaje("El saldo no puede ser negativo", true);
                return false;
            }
            return true; // si pasa, se envía al backend (que valida OTRA vez)
        }

        // --- LISTAR (GET) ---
        async function listar() {
            try {
                // fetch con método GET (por defecto). No enviamos cuerpo.
                const res = await fetch(BASE_URL);
                const usuarios = await res.json();

                const cuerpo = document.getElementById("tablaBody");
                cuerpo.innerHTML = ""; // limpiamos la tabla

                // Construimos una fila por cada usuario con sus botones.
                usuarios.forEach(u => {
                    const fila = document.createElement("tr");
                    fila.innerHTML = `
                        <td>${u.id}</td>
                        <td>${u.nombre}</td>
                        <td>${u.direccion ?? ""}</td>
                        <td>${u.telefono}</td>
                        <td>${u.correo}</td>
                        <td>${u.saldo}</td>
                        <td>
                            <button class="actualizar" onclick="editar(${u.id})">Editar</button>
                            <button class="eliminar" onclick="eliminar(${u.id})">Eliminar</button>
                        </td>`;
                    cuerpo.appendChild(fila);
                });
            } catch (e) {
                mostrarMensaje("Error al listar: " + e.message, true);
            }
        }

        // --- GUARDAR (POST) y ACTUALIZAR (PUT) ---
        async function guardar() {
            // Recogemos los valores del formulario en un objeto JS.
            const usuario = {
                id: document.getElementById("id").value || null,
                nombre: document.getElementById("nombre").value,
                direccion: document.getElementById("direccion").value,
                telefono: parseInt(document.getElementById("telefono").value) || 0,
                correo: document.getElementById("correo").value,
                saldo: parseInt(document.getElementById("saldo").value) || 0
            };

            // Validación en el frontend antes de gastar la petición.
            if (!validarFormulario(usuario)) return;

            // Si hay id es una ACTUALIZACIÓN (PUT), si no, es un ALTA (POST).
            const esNuevo = usuario.id === null;

            try {
                const res = await fetch(BASE_URL, {
                    method: esNuevo ? "POST" : "PUT",   // verbo HTTP
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(usuario)       // convertimos a JSON
                });
                const resultado = await res.json();

                if (resultado) {
                    mostrarMensaje(esNuevo ? "Usuario creado" : "Usuario actualizado", false);
                    cancelarEdicion();
                    listar();
                } else {
                    mostrarMensaje("No se pudo guardar (validación falló en el backend)", true);
                }
            } catch (e) {
                mostrarMensaje("Error: " + e.message, true);
            }
        }

        // --- ELIMINAR (DELETE) ---
        async function eliminar(id) {
            if (!confirm("¿Seguro que desea eliminar el usuario " + id + "?")) return;

            try {
                const res = await fetch(BASE_URL + "/" + id, { method: "DELETE" });
                const resultado = await res.json();

                if (resultado) {
                    mostrarMensaje("Usuario eliminado", false);
                    listar();
                } else {
                    mostrarMensaje("No se pudo eliminar", true);
                }
            } catch (e) {
                mostrarMensaje("Error: " + e.message, true);
            }
        }

        // --- CARGAR los datos de un usuario en el formulario para editarlo ---
        async function editar(id) {
            try {
                const res = await fetch(BASE_URL + "/" + id);
                const u = await res.json();

                document.getElementById("id").value = u.id;
                document.getElementById("nombre").value = u.nombre;
                document.getElementById("direccion").value = u.direccion ?? "";
                document.getElementById("telefono").value = u.telefono;
                document.getElementById("correo").value = u.correo;
                document.getElementById("saldo").value = u.saldo;
            } catch (e) {
                mostrarMensaje("Error al cargar: " + e.message, true);
            }
        }

        // --- Limpiar el formulario (cancelar edición) ---
        function cancelarEdicion() {
            document.getElementById("id").value = "";
            document.getElementById("nombre").value = "";
            document.getElementById("direccion").value = "";
            document.getElementById("telefono").value = "";
            document.getElementById("correo").value = "";
            document.getElementById("saldo").value = "";
        }

        // Al cargar la página, mostramos los usuarios existentes.
        listar();
    </script>

</body>
</html>
